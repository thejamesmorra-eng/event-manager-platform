server:
  port: 8080

spring:
  application:
    name: event-manager

  datasource:
    url: ${PSQL_URL:jdbc:postgresql://localhost:5432/event_manager}
    username: ${PSQL_USERNAME:postgres}
    password: ${PSQL_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    event-changes: "event-changes"

jwt:
  secret: ${JWT_SECRET:29d3b4880569e06b8e7a43619eb8d445fa53e6dde2e5e22ddf1091704036554c}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  default:
    login: admin
    age: 18
    password: ${ADMIN_PASSWORD:adminPassword}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    dev.sorokin.eventmanager: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

scheduler:
  event-status:
    cron: "0 * * * * *"