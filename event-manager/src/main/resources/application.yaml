server:
  port: 8080

spring:
  application:
    name: event-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/event_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

jwt:
  secret: "29d3b4880569e06b8e7a43619eb8d445fa53e6dde2e5e22ddf1091704036554c"
  expiration: 86400000

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    dev.sorokin.eventmanager: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html